  function getLetter(name) {

    const vowels = ["A", "E", "I", "O", "U"];

    let firstLetter = name[0].toUpperCase();

  
    if (vowels.includes(firstLetter)) {
        return firstLetter;
    }

  
    if (name.length >= 2) {
        return name[1].toUpperCase();
    }

    
    return firstLetter;
}
